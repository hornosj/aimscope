[project]
name = "aimscope-lab"
version = "0.1.0"
description = "Calibracao offline de ancoras por VOD (docs/design-vod-lab.md, ADR 0003)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
]

[project.optional-dependencies]
# OCR do score na tela; sem ele, --score manual continua funcionando
ocr = ["pytesseract"]
# download de VODs publicos (fetch)
fetch = ["yt-dlp"]
dev = ["pytest", "pyarrow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aimscope_lab"]
