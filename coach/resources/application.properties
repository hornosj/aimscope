# ===========================================================================
# aimscope-coach — agente Embabel (batch, sem servidor HTTP)
# ===========================================================================
spring.main.web-application-type=none
spring.main.banner-mode=off

# --- OpenRouter (OpenAI-compativel) -----------------------------------------
# Mesmo padrao do beautiful-linkedin: env OPENROUTER_APIKEY; o Spring AI
# ACRESCENTA /v1/chat/completions a base (a base NAO pode incluir /v1).
embabel.agent.platform.models.openai.base-url=https://openrouter.ai/api
# Default NAO-vazio: o processo SOBE mesmo sem chave (a chamada LLM falha e o
# GOAP degrada pro fallback deterministico — nunca quebra no boot).
embabel.agent.platform.models.openai.api-key=${OPENROUTER_APIKEY:no-key-configured}
# Retry curto: tier free da 429; falhar rapido = cair rapido no fallback.
embabel.agent.platform.models.openai.max-attempts=2
embabel.agent.platform.models.openai.backoff-millis=1000

# Modelo default: gratuito + tool-calling (registrado em models/openai-models.yml).
# Override em runtime: env AIMSCOPE_LLM.
embabel.models.default-llm=openai/gpt-oss-120b:free

# Headers de atribuicao do OpenRouter.
embabel.agent.platform.models.options.http-headers.HTTP-Referer=https://github.com/jpedr/aimscope
embabel.agent.platform.models.options.http-headers.X-Title=aimscope-coach

logging.level.root=WARN
logging.level.com.embabel=INFO
