# ===========================================================================
# aimscope-coach — agente Embabel (batch, sem servidor HTTP)
# ===========================================================================
spring.main.web-application-type=none
spring.main.banner-mode=off

# --- NVIDIA build (OpenAI-compativel) ---------------------------------------
# env NVIDIA_APIKEY (mesma que o exemplo da NVIDIA chama de NVIDIA_API_KEY; aqui
# seguimos o nome ja presente no sistema do JP). O Spring AI ACRESCENTA
# /v1/chat/completions a base, entao a base NAO pode incluir /v1.
embabel.agent.platform.models.openai.base-url=https://integrate.api.nvidia.com
# Default NAO-vazio: o processo SOBE mesmo sem chave (a chamada LLM falha e o
# GOAP degrada pro fallback deterministico — nunca quebra no boot).
embabel.agent.platform.models.openai.api-key=${NVIDIA_APIKEY:no-key-configured}
# Retry curto: falhar rapido = cair rapido no fallback deterministico.
embabel.agent.platform.models.openai.max-attempts=2
embabel.agent.platform.models.openai.backoff-millis=1000

# Modelo default = topo da cadeia de fallback (pedido do JP 2026-07-02:
# GLM-5.2 como padrao). O insight_agent percorre a cadeia completa
# (models/openai-models.yml) ate um modelo produzir narrativa valida; este
# default so importa pra chamadas que nao usam a cadeia. Override pontual:
# env AIMSCOPE_LLM.
embabel.models.default-llm=z-ai/glm-5.2

# Timeout do cliente HTTP: sem isso, o v4-pro (que enfileira >90s no free) trava
# a UI. Bounded curto = a cadeia cai rapido pro proximo modelo.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=30s

logging.level.root=WARN
logging.level.com.embabel=INFO
