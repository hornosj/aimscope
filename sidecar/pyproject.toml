[project]
name = "aimscope-sidecar"
version = "0.1.0"
description = "Analise de mecanica de mira/mouse control (sidecar do aimscope)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aimscope_sidecar"]
